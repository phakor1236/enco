name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # pnpm 11.x requires Node >= 22.13 (uses node:sqlite builtin)
  NODE_VERSION: '22'
  PNPM_VERSION: '11.1.2'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate (needed for typed imports during lint)
        run: pnpm -F @app/api db:generate
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @app/api db:generate
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vella
          POSTGRES_PASSWORD: vella_ci_pw
          POSTGRES_DB: vella_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vella -d vella_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # In CI we collapse app + test DB into one ephemeral instance (no isolation
      # concern since the runner is fresh every job).
      DATABASE_URL: postgresql://vella:vella_ci_pw@localhost:5432/vella_test
      TEST_DATABASE_URL: postgresql://vella:vella_ci_pw@localhost:5432/vella_test
      JWT_SECRET: ci_only_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @app/api db:generate
      # No-op today (Phase 0 has no models). Becomes load-bearing in T1.1
      # when User schema lands — placed here now so the order is set.
      - run: pnpm -F @app/api db:migrate
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @app/api db:generate
      - run: pnpm build
