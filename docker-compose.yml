name: vella

services:
  db:
    image: postgres:16-alpine
    container_name: vella-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vella
      POSTGRES_PASSWORD: vella_dev_pw
      POSTGRES_DB: vella
      # Init script creates the test DB alongside the app DB
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      # Host 5433 -> container 5432 (avoid clash with default 5432 / supabase 54322)
      - '5433:5432'
    volumes:
      - vella_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vella -d vella']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  vella_pgdata:
    name: vella_pgdata
